<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strategy Hub</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#fff4f8;
  color:#253044
}

header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff
}

button{
  border:0;
  border-radius:24px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer
}

.connect{
  background:#ff4774;
  color:white
}

.card{
  margin:24px;
  padding:24px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 30px #0002
}

.status{
  font-weight:700
}

.muted{
  color:#7b8798
}
</style>
</head>

<body>

<header>
  <strong>✦ STRATEGY HUB</strong>
  <button class="connect" id="connectBtn">
    Connect Deriv
  </button>
</header>

<div class="card">
  <h1>Strategy Hub</h1>

  <p class="muted">
    Build, test and run your Deriv strategies from one place.
  </p>

  <p class="status" id="status">
    Demo • Not connected
  </p>
</div>

<script>

const REDIRECT_URI = window.location.origin + "/";

const statusEl = document.getElementById("status");
const btn = document.getElementById("connectBtn");

function randomString(bytes=32){
  const a = new Uint8Array(bytes);
  crypto.getRandomValues(a);

  return [...a]
    .map(x => x.toString(16).padStart(2,"0"))
    .join("");
}

function base64url(bytes){
  let s = btoa(
    String.fromCharCode(...bytes)
  );

  return s
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

async function sha256(text){
  return new Uint8Array(
    await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(text)
    )
  );
}

async function startOAuth(){

  const clientId = window.prompt(
    "Enter your Deriv OAuth Client ID:"
  );

  if(!clientId) return;

  const verifier = randomString(32);
  const state = randomString(16);

  const challenge =
    base64url(await sha256(verifier));

  sessionStorage.setItem(
    "deriv_pkce_verifier",
    verifier
  );

  sessionStorage.setItem(
    "deriv_oauth_state",
    state
  );

  sessionStorage.setItem(
    "deriv_client_id",
    clientId
  );

  const u = new URL(
    "https://auth.deriv.com/oauth2/auth"
  );

  u.searchParams.set(
    "response_type",
    "code"
  );

  u.searchParams.set(
    "client_id",
    clientId
  );

  u.searchParams.set(
    "redirect_uri",
    REDIRECT_URI
  );

  u.searchParams.set(
    "scope",
    "trade"
  );

  u.searchParams.set(
    "state",
    state
  );

  u.searchParams.set(
    "code_challenge",
    challenge
  );

  u.searchParams.set(
    "code_challenge_method",
    "S256"
  );

  location.href = u.toString();
}

async function handleCallback(){

  const p =
    new URLSearchParams(location.search);

  const code = p.get("code");
  const returnedState = p.get("state");

  if(!code) return;

  const savedState =
    sessionStorage.getItem(
      "deriv_oauth_state"
    );

  const verifier =
    sessionStorage.getItem(
      "deriv_pkce_verifier"
    );

  const clientId =
    sessionStorage.getItem(
      "deriv_client_id"
    );

  if(
    !returnedState ||
    returnedState !== savedState
  ){

    statusEl.textContent =
      "Connection failed: state mismatch.";

    return;
  }

  statusEl.textContent =
    "Connecting to Deriv…";

  try{

    const r = await fetch(
      "/.netlify/functions/deriv-token",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          code,
          client_id:clientId,
          code_verifier:verifier,
          redirect_uri:REDIRECT_URI
        })
      }
    );

    const data = await r.json();

    if(!r.ok)
      throw new Error(
        data.error ||
        "Token exchange failed"
      );

    sessionStorage.removeItem(
      "deriv_oauth_state"
    );

    sessionStorage.removeItem(
      "deriv_pkce_verifier"
    );

    history.replaceState(
      {},
      "",
      "/"
    );

    statusEl.textContent =
      "Connected to Deriv";

    btn.textContent =
      "Connected ✓";

    sessionStorage.setItem(
      "deriv_access_token",
      data.access_token
    );

    sessionStorage.setItem(
      "deriv_expires_at",
      String(
        Date.now() +
        ((data.expires_in || 3600) * 1000)
      )
    );

  }catch(e){

    statusEl.textContent =
      "Connection failed: " +
      e.message;
  }
}

btn.addEventListener(
  "click",
  startOAuth
);

handleCallback();

</script>

</body>
</html>
