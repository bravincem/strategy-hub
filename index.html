<script>

let running=false;
let timer=null;

let balance=100;
let wins=0;
let losses=0;
let pnl=0;
let total=0;

let stake=1;
let step=0;


/* SIMULATED TICK DIGIT */
function simulatedTick(){
    return Math.floor(Math.random()*10);
}


/* CONTRACT LOGIC */
function contractWin(digit,contract){

    if(contract==="Over 1"){
        return digit>1;
    }

    if(contract==="Under 8"){
        return digit<8;
    }

    if(contract==="Rise"){
        return digit>=5;
    }

    if(contract==="Fall"){
        return digit<5;
    }

    return digit>1;
}


/* UPDATE SCREEN */
function update(){

    document.getElementById("balance").textContent =
        "$"+balance.toFixed(2);

    document.getElementById("wins").textContent =
        wins;

    document.getElementById("losses").textContent =
        losses;

    document.getElementById("pnl").textContent =
        "$"+pnl.toFixed(2);

    document.getElementById("total").textContent =
        total;

    document.getElementById("rwins").textContent =
        wins;

    document.getElementById("rlosses").textContent =
        losses;

    document.getElementById("rpnl").textContent =
        "$"+pnl.toFixed(2);
}


/* ONE SIMULATED TRADE */
function trade(){

    let base =
        parseFloat(document.getElementById("stake").value) || 1;

    let mg =
        parseFloat(document.getElementById("mg").value) || 2;

    let contract =
        document.getElementById("contract").value;

    if(step===0){
        stake=base;
    }


    /* Generate simulated last digit */
    let digit=simulatedTick();


    /* Check contract */
    let won=contractWin(digit,contract);

    total++;


    /* WIN */
    if(won){

        let payoutRate=0.85;

        if(contract==="Rise" || contract==="Fall"){
            payoutRate=0.95;
        }

        let profit=stake*payoutRate;

        balance+=profit;
        pnl+=profit;
        wins++;

        step=0;

        add(
            "DIGIT "+digit+" • "+contract+" • WIN",
            "+$"+profit.toFixed(2),
            "win"
        );
    }


    /* LOSS */
    else{

        balance-=stake;
        pnl-=stake;
        losses++;

        step++;

        add(
            "DIGIT "+digit+" • "+contract+" • LOSS",
            "-$"+stake.toFixed(2),
            "loss"
        );


        /* MARTINGALE */
        if(
            step >
            parseInt(
                document.getElementById("steps").value
            )
        ){

            step=0;

        }else{

            stake=stake*mg;
        }
    }

    update();
}


/* ADD TRADE TO HISTORY */
function add(result,value,type){

    let market=
        document.getElementById("market").value;

    let row=
        document.createElement("div");

    row.className="trade";

    row.innerHTML=
        "<span>"+
        new Date().toLocaleTimeString()+
        " • "+
        market+
        " • "+
        result+
        "</span>"+
        "<span class='"+type+"'>"+
        value+
        "</span>";

    document
        .getElementById("log")
        .prepend(row);
}


/* START BOT */
function startBot(){

    if(running)return;

    running=true;

    timer=setInterval(
        trade,
        900
    );
}


/* STOP BOT */
function stopBot(){

    running=false;

    clearInterval(timer);

    timer=null;
}


/* CLEAR RESULTS */
function clearLog(){

    stopBot();

    document.getElementById("log").innerHTML="";

    balance=100;
    wins=0;
    losses=0;
    pnl=0;
    total=0;
    stake=1;
    step=0;

    update();
}


/* BACKTEST 100 TRADES */
function runBacktest(){

    show(
        "builder",
        document.querySelectorAll(".nav button")[1]
    );

    clearLog();

    for(let i=0;i<100;i++){

        trade();
    }
}


/* QUICK BOT */
function runPreset(){

    show(
        "builder",
        document.querySelectorAll(".nav button")[1]
    );

    loadPreset("Over 1");
}


/* LOAD PRESET */
function loadPreset(contract){

    document.getElementById("contract").value=
        contract;

    document.getElementById("stake").value=
        1;

    document.getElementById("mg").value=
        2;

    document.getElementById("steps").value=
        4;
}


/* DEMO SIGNAL */
function newSignal(){

    let signals=[
        "OVER 1",
        "UNDER 8",
        "RISE",
        "FALL"
    ];

    let signal=
        signals[
            Math.floor(
                Math.random()*signals.length
            )
        ];

    document.getElementById("signal").innerHTML=
        "<b>Demo Signal: "+
        signal+
        "</b> • Simulated tick data.";
}


update();

</script>
